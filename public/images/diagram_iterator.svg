<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-extends" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-implements" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>

    <filter id="box-shadow" x="-8%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>

    <style>
      .interface-box { fill: #059669; stroke: #047857; stroke-width: 1.5; rx: 8px; filter: url(#box-shadow); }
      .class-box { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; rx: 8px; filter: url(#box-shadow); }
      .node-name { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .node-tag { font-size: 12px; font-weight: 500; fill: rgba(255,255,255,0.85); text-anchor: middle; }
      .line-extends { stroke: #b91c1c; stroke-width: 2.2; fill: none; }
      .line-implements { stroke: #334155; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    </style>
  </defs>

  <!-- ================= ROOT: ITERATOR ================= -->
  <rect x="360" y="40" width="180" height="56" class="interface-box" />
  <text x="450" y="65" class="node-name">Iterator</text>
  <text x="450" y="83" class="node-tag">&lt;interface&gt;</text>

  <!-- ================= LISTITERATOR (EXTENDS ITERATOR) ================= -->
  <line x1="280" y1="180" x2="390" y2="105" class="line-extends" marker-end="url(#arrow-extends)" />

  <rect x="190" y="180" width="180" height="56" class="interface-box" />
  <text x="280" y="205" class="node-name">ListIterator</text>
  <text x="280" y="223" class="node-tag">&lt;interface&gt;</text>

  <!-- ================= SECOND ITERATOR INTERFACE NODE (OR DIRECT ARROW) ================= -->
  <rect x="490" y="180" width="180" height="56" class="interface-box" />
  <text x="580" y="205" class="node-name">Iterator</text>
  <text x="580" y="223" class="node-tag">&lt;interface&gt;</text>
  <line x1="580" y1="180" x2="510" y2="105" class="line-extends" marker-end="url(#arrow-extends)" />

  <!-- ================= IMPLEMENTING CLASSES ================= -->
  <!-- ArrayList implements ListIterator -->
  <line x1="200" y1="330" x2="250" y2="245" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="130" y="330" width="150" height="56" class="class-box" />
  <text x="205" y="355" class="node-name">ArrayList</text>
  <text x="205" y="373" class="node-tag">&lt;class&gt;</text>

  <!-- LinkedList implements ListIterator -->
  <line x1="375" y1="330" x2="310" y2="245" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="300" y="330" width="150" height="56" class="class-box" />
  <text x="375" y="355" class="node-name">LinkedList</text>
  <text x="375" y="373" class="node-tag">&lt;class&gt;</text>

  <!-- Vector implements Iterator -->
  <line x1="580" y1="330" x2="580" y2="245" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="505" y="330" width="150" height="56" class="class-box" />
  <text x="580" y="355" class="node-name">Vector</text>
  <text x="580" y="373" class="node-tag">&lt;class&gt;</text>

  <!-- ================= LEGEND (BOTTOM) ================= -->
  <g transform="translate(295, 450)">
    <rect x="0" y="0" width="310" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="25" y1="27" x2="65" y2="27" class="line-extends" marker-end="url(#arrow-extends)" />
    <text x="75" y="31" font-size="13.5" font-weight="600" fill="#b91c1c">extends</text>
    <line x1="160" y1="27" x2="200" y2="27" class="line-implements" marker-end="url(#arrow-implements)" />
    <text x="210" y="31" font-size="13.5" font-weight="600" fill="#334155">implements</text>
  </g>
</svg>
