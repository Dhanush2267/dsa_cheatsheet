<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-extends" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
    <marker id="arrow-implements" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>

    <filter id="box-shadow" x="-8%" y="-8%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12" />
    </filter>

    <style>
      .interface-box { fill: #059669; stroke: #047857; stroke-width: 1.5; rx: 8px; filter: url(#box-shadow); }
      .class-box { fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5; rx: 8px; filter: url(#box-shadow); }
      .node-name { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .node-tag { font-size: 12px; font-weight: 500; fill: rgba(255,255,255,0.85); text-anchor: middle; }
      .line-extends { stroke: #b91c1c; stroke-width: 2.2; fill: none; }
      .line-implements { stroke: #334155; stroke-width: 2; stroke-dasharray: 6,4; fill: none; }
    </style>
  </defs>

  <!-- ================= TOP INTERFACES ================= -->
  <!-- Comparable -->
  <rect x="200" y="50" width="200" height="58" class="interface-box" />
  <text x="300" y="76" class="node-name">Comparable</text>
  <text x="300" y="95" class="node-tag">&lt;interface&gt;</text>

  <!-- Comparator -->
  <rect x="520" y="50" width="200" height="58" class="interface-box" />
  <text x="620" y="76" class="node-name">Comparator</text>
  <text x="620" y="95" class="node-tag">&lt;interface&gt;</text>

  <!-- ================= BOTTOM CLASSES ================= -->
  <!-- String implements Comparable -->
  <line x1="200" y1="230" x2="270" y2="118" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="120" y="230" width="160" height="56" class="class-box" />
  <text x="200" y="255" class="node-name">String</text>
  <text x="200" y="273" class="node-tag">&lt;class&gt;</text>

  <!-- Integer implements Comparable -->
  <line x1="370" y1="230" x2="330" y2="118" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="290" y="230" width="160" height="56" class="class-box" />
  <text x="370" y="255" class="node-name">Integer</text>
  <text x="370" y="273" class="node-tag">&lt;class&gt;</text>

  <!-- Double implements Comparable AND Comparator -->
  <line x1="560" y1="230" x2="380" y2="118" class="line-implements" marker-end="url(#arrow-implements)" />
  <line x1="620" y1="230" x2="620" y2="118" class="line-implements" marker-end="url(#arrow-implements)" />
  <rect x="520" y="230" width="160" height="56" class="class-box" />
  <text x="600" y="255" class="node-name">Double</text>
  <text x="600" y="273" class="node-tag">&lt;class&gt;</text>

  <!-- ================= LEGEND (BOTTOM) ================= -->
  <g transform="translate(295, 430)">
    <rect x="0" y="0" width="310" height="54" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="25" y1="27" x2="65" y2="27" class="line-extends" marker-end="url(#arrow-extends)" />
    <text x="75" y="31" font-size="13.5" font-weight="600" fill="#b91c1c">extends</text>
    <line x1="160" y1="27" x2="200" y2="27" class="line-implements" marker-end="url(#arrow-implements)" />
    <text x="210" y="31" font-size="13.5" font-weight="600" fill="#334155">implements</text>
  </g>
</svg>
