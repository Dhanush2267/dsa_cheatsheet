<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Silver Metallic Gradient for Card Border -->
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Bright Metallic Gradient for Primary Branches -->
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Node Ring Gradient -->
    <radialGradient id="nodeRingGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>

  <!-- Pure Black Background -->
  <rect width="512" height="512" fill="#000000" />

  <!-- Rounded Squircle Card -->
  <rect x="28" y="28" width="456" height="456" rx="102" fill="url(#bgGrad)" stroke="url(#silverBorder)" stroke-width="12" />

  <!-- Vertical Split Axis -->
  <line x1="256" y1="148" x2="256" y2="410" stroke="#64748b" stroke-width="8" stroke-dasharray="12 10" opacity="0.65" />

  <!-- Horizontal Traversal Link -->
  <line x1="148" y1="332" x2="364" y2="332" stroke="#64748b" stroke-width="14" stroke-linecap="round" opacity="0.75" />

  <!-- Main Binary Tree Branches -->
  <line x1="256" y1="148" x2="148" y2="332" stroke="url(#branchGrad)" stroke-width="26" stroke-linecap="round" />
  <line x1="256" y1="148" x2="364" y2="332" stroke="url(#branchGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- Root Node (Top) -->
  <circle cx="256" cy="148" r="54" fill="#08090c" stroke="url(#nodeRingGrad)" stroke-width="14" />
  <circle cx="256" cy="148" r="32" fill="#0e0f14" />
  <circle cx="256" cy="148" r="16" fill="#ffffff" />

  <!-- Left Child Node -->
  <circle cx="148" cy="332" r="46" fill="#08090c" stroke="url(#nodeRingGrad)" stroke-width="12" />
  <circle cx="148" cy="332" r="27" fill="#0e0f14" />
  <circle cx="148" cy="332" r="13" fill="#ffffff" />

  <!-- Right Child Node -->
  <circle cx="364" cy="332" r="46" fill="#08090c" stroke="url(#nodeRingGrad)" stroke-width="12" />
  <circle cx="364" cy="332" r="27" fill="#0e0f14" />
  <circle cx="364" cy="332" r="13" fill="#ffffff" />
</svg>
